<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CRM de Leads | PAO</title>
  <link rel="icon" href="/img/logo-pao.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/crm.css">
</head>
<body>
  <header class="top">
    <div class="top__brand">
      <img src="/img/logo-pao.jpg" alt="">
      <h1><b>PAO</b> · CRM</h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Vistas">
      <button role="tab" data-view="tablero" aria-selected="true">Tablero</button>
      <button role="tab" data-view="lista" aria-selected="false">Lista</button>
      <button role="tab" data-view="metricas" aria-selected="false">Métricas</button>
    </nav>
    <div class="top__actions">
      <a class="btn" href="/" target="_blank" rel="noopener">Ver landing</a>
      <a class="btn btn--primary" href="/api/admin/leads.csv">Exportar CSV</a>
    </div>
  </header>

  <section class="today" id="today" aria-label="Prioridades de hoy"></section>

  <section class="filters">
    <input type="search" id="q" placeholder="Buscar por nombre, WhatsApp, email o negocio…" aria-label="Buscar">
    <div class="seg" role="group" aria-label="Filtrar por calificación" id="grade-filter">
      <button data-g="" class="on">Todos</button>
      <button data-g="A">A</button>
      <button data-g="B">B</button>
      <button data-g="C">C</button>
    </div>
    <button class="btn btn--ghost" id="clear-focus" hidden>Quitar filtro rápido ✕</button>
    <button class="btn btn--ghost" id="reload" title="Actualizar">↻ Actualizar</button>
  </section>

  <main>
    <section class="view view--tablero is-active" id="view-tablero"><div class="board" id="board"></div></section>
    <section class="view" id="view-lista"><div class="tablewrap"><table class="table" id="table"></table></div></section>
    <section class="view" id="view-metricas"><div id="metrics"></div></section>
  </main>

  <!-- Ficha del lead -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="d-name">
      <div id="drawer-body"></div>
    </div>
  </aside>

  <!-- Diálogo al mover de etapa -->
  <dialog class="dlg" id="stage-dlg">
    <form method="dialog" id="stage-form">
      <h3 id="stage-title"></h3>
      <div id="stage-fields"></div>
      <div class="dlg__actions">
        <button class="btn btn--ghost" value="cancel" formnovalidate>Cancelar</button>
        <button class="btn btn--primary" value="ok">Confirmar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/admin/crm.js" defer></script>
</body>
</html>
